name: Site
# zgx.zeron.sh: built from website/ and the repository's docs, deployed to
# Cloudflare Pages. The deploy steps wait for the Cloudflare secrets: without
# them the site still builds, so a broken page fails here first.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "site/data.json"
      - "site/micro.jsonl"
      - "scripts/build_site.py"
      - "scripts/perf/README.md"
      - "crates/zgx-script/src/bin/zgx.rs"
      - "crates/zgx-script/src/lint.rs"
      - "crates/zgx-run/src/main.rs"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          # The project, once: after the first run this says it already exists.
          preCommands: wrangler pages project create zgx-site --production-branch main || echo "zgx-site exists"
          command: pages deploy dist --project-name zgx-site --branch main --commit-dirty=true
      - name: Attach zgx.zeron.sh
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          answer=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/zgx-site/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"zgx.zeron.sh"}')
          echo "$answer" | jq -c '{success, errors}'
          if echo "$answer" | jq -e '.success' >/dev/null; then exit 0; fi
          # Added by an earlier run: nothing to do.
          echo "$answer" | grep -qiE 'already (exists|added)|8000018' && exit 0
          exit 1
      - name: No Cloudflare secrets
        if: github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; the site was built but not deployed."
